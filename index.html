<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyBar</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f5f5f7;color:#171717;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}

header{
 padding:22px 18px 10px;background:#111;color:white;
 position:sticky;top:0;z-index:10
}
.brand{font-size:25px;font-weight:800}
.sub{opacity:.65;font-size:12px;margin-top:3px}

.search{
 margin-top:15px;width:100%;padding:13px 15px;
 border-radius:13px;border:0;background:#292929;
 color:white;outline:0
}
.search::placeholder{color:#aaa}

main{padding:16px}

.hero{
 background:#fff;border-radius:20px;padding:18px;
 margin-bottom:14px;box-shadow:0 3px 16px #00000009
}
.hero h1{margin:0 0 7px;font-size:22px}
.hero p{margin:0;color:#666;font-size:14px}

.row{
 display:flex;gap:8px;overflow:auto;padding:2px 0 9px
}

.pill{
 white-space:nowrap;padding:9px 13px;border-radius:999px;
 background:#e9e9ed;color:#555
}
.pill.active{background:#111;color:white}

.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}

.card{
 background:#fff;border-radius:17px;padding:15px;
 box-shadow:0 2px 10px #00000008;position:relative
}

.card h3{margin:0 28px 6px 0;font-size:16px}
.meta{font-size:12px;color:#777}

.tag{
 display:inline-block;margin-top:8px;padding:5px 8px;
 border-radius:8px;background:#f0f0f2;font-size:11px
}
.ok{background:#e5f7e9;color:#167238}
.warn{background:#fff2d8;color:#8a5a00}
.bad{background:#fbe5e5;color:#9a2626}

.fav{
 position:absolute;right:12px;top:10px;
 background:none;font-size:21px
}

.sectionTitle{
 font-size:18px;font-weight:800;margin:20px 0 10px
}

.empty{
 text-align:center;color:#777;padding:35px 10px
}

.bottom{
 position:fixed;bottom:0;left:0;right:0;background:#fff;
 border-top:1px solid #ddd;z-index:20;
 display:flex;justify-content:center
}

.bottom button{
 flex:1;max-width:760px;background:white;
 padding:11px 2px 12px;color:#777;font-size:11px
}

.bottom span{
 display:block;font-size:21px;margin-bottom:2px
}

.bottom .on{color:#111;font-weight:800}

.list{
 display:flex;flex-direction:column;gap:8px
}

.item{
 background:#fff;border-radius:14px;padding:13px 14px;
 display:flex;justify-content:space-between;align-items:center
}

.item small{color:#777}

.danger{
 color:#c33;background:#fff0f0;
 border-radius:9px;padding:6px 9px
}

.overlay{
 position:fixed;inset:0;background:#0008;z-index:30;
 display:none;align-items:flex-end
}

.sheet{
 background:#fff;width:100%;max-width:760px;margin:auto;
 border-radius:24px 24px 0 0;max-height:90vh;
 overflow:auto;padding:20px
}

.close{
 float:right;background:#eee;border-radius:50%;
 width:34px;height:34px
}

.sheet h2{margin:3px 45px 8px}

.field{margin:12px 0}

.field label{
 display:block;font-size:12px;color:#666;margin-bottom:6px
}

.field input,.field select,.field textarea{
 width:100%;padding:11px;border:1px solid #ddd;
 border-radius:11px;background:#fafafa
}

.primary{
 background:#111;color:white;padding:12px 16px;
 border-radius:11px;font-weight:700
}

.secondary{
 background:#eee;padding:12px 16px;border-radius:11px
}

.actions{
 display:flex;gap:8px;margin-top:15px
}

.actions>*{flex:1}

.recipeLine{
 display:flex;justify-content:space-between;
 border-bottom:1px solid #eee;padding:10px 0
}

.missing{color:#c33}
.match{color:#16803c}

.statgrid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px
}

.stat{
 background:#fff;border-radius:15px;padding:13px;
 text-align:center
}

.stat b{font-size:21px;display:block}
.stat small{color:#777}

.fab{
 position:fixed;right:20px;bottom:82px;
 background:#111;color:#fff;border-radius:50%;
 width:55px;height:55px;font-size:25px;
 z-index:15;box-shadow:0 5px 18px #0003
}

@media(min-width:650px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .overlay{align-items:center}
 .sheet{border-radius:22px;max-height:85vh}
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="brand">🍸 MyBar</div>
 <div class="sub">내 재료로 만드는 나만의 칵테일 바</div>

 <input
  id="globalSearch"
  class="search"
  placeholder="칵테일 또는 재료 검색">
</header>

<main id="main"></main>

</div>

<nav class="bottom">

<button data-tab="home">
 <span>🏠</span>홈
</button>

<button data-tab="cocktails">
 <span>🍸</span>칵테일
</button>

<button data-tab="ingredients">
 <span>🧊</span>내 재료
</button>

<button data-tab="favorites">
 <span>❤️</span>즐겨찾기
</button>

</nav>

<button class="fab" id="addCocktail">＋</button>

<div class="overlay" id="modal">
 <div class="sheet" id="sheet"></div>
</div>

<script>

const defaultIngredients=[

"진","럼","브랜디","스카치위스키","버번위스키","보드카",

"깔루아","트리플섹","크렘드카카오 화이트",
"크렘드카카오 브라운","생제르망","디사론노",
"페퍼민트그린","피치트리","말리부럼","힙노틱",
"버터스카치리큐르","블루큐라소","바나나리큐르",
"리몬첼로","멜론리큐르",

"바닐라시럽","그레나딘시럽","그린애플시럽",
"모히또민트시럽","리치시럽","자몽시럽","카시스시럽",
"수박시럽","블루큐라소시럽","엘더플라워시럽",
"코코넛시럽","피치시럽","검시럽",

"콜라","사이다","오렌지주스","크랜베리주스",
"파인애플주스","사과주스","우유","토닉워터"

];

const recipes=[

["진토닉","진","진|45ml","토닉워터|120ml",13],

["스크루드라이버","보드카",
"보드카|45ml","오렌지주스|120ml",13],

["블랙 러시안","보드카",
"보드카|45ml","깔루아|20ml",26],

["화이트 러시안","보드카",
"보드카|45ml","깔루아|20ml","우유|30ml",18],

["럼 콜라","럼",
"럼|45ml","콜라|120ml",13],

["위스키 콜라","버번위스키",
"버번위스키|45ml","콜라|120ml",13],

["말리부 오렌지","말리부럼",
"말리부럼|45ml","오렌지주스|120ml",9],

["말리부 파인애플","말리부럼",
"말리부럼|45ml","파인애플주스|120ml",9],

["퍼지 네이블","피치트리",
"피치트리|45ml","오렌지주스|120ml",10],

["피치 크랜베리","피치트리",
"피치트리|45ml","크랜베리주스|120ml",10],

["보드카 크랜베리","보드카",
"보드카|45ml","크랜베리주스|120ml",13],

["보드카 파인애플","보드카",
"보드카|45ml","파인애플주스|120ml",13],

["럼 파인애플","럼",
"럼|45ml","파인애플주스|120ml",13],

["아마레또 오렌지","디사론노",
"디사론노|45ml","오렌지주스|120ml",10],

["갓마더","보드카",
"보드카|45ml","디사론노|20ml",25],

["멜론 볼","보드카",
"보드카|30ml","멜론리큐르|30ml",
"오렌지주스|90ml",12],

["블루 하와이안 스타일","럼",
"럼|30ml","블루큐라소|20ml",
"파인애플주스|90ml",12],

["리몬첼로 토닉","리몬첼로",
"리몬첼로|45ml","토닉워터|120ml",11],

["페퍼민트 밀크","페퍼민트그린",
"페퍼민트그린|30ml","우유|120ml",6],

["민트 카카오 밀크","페퍼민트그린",
"페퍼민트그린|20ml",
"크렘드카카오 화이트|20ml",
"우유|100ml",6],

["초콜릿 밀크","크렘드카카오 화이트",
"크렘드카카오 화이트|30ml","우유|120ml",6],

["바나나 밀크","바나나리큐르",
"바나나리큐르|30ml","우유|120ml",6],

["코코넛 파인애플","말리부럼",
"말리부럼|45ml","파인애플주스|90ml",
"코코넛시럽|10ml",9],

["엘더플라워 토닉","생제르망",
"생제르망|30ml","토닉워터|120ml",7],

["블루 오렌지","블루큐라소",
"블루큐라소|30ml","오렌지주스|120ml",6],

["블루큐라소 토닉","블루큐라소",
"블루큐라소|30ml","토닉워터|120ml",6],

["자몽 진","진",
"진|45ml","자몽시럽|15ml",
"토닉워터|120ml",11],

["애플 보드카","보드카",
"보드카|45ml","사과주스|120ml",11],

["애플 진 하이볼","진",
"진|45ml","사과주스|90ml",
"토닉워터|60ml",11],

["그레나딘 보드카","보드카",
"보드카|45ml","그레나딘시럽|15ml",
"오렌지주스|90ml",11],

["피치 사이다","피치트리",
"피치트리|45ml","사이다|120ml",10],

["멜론 사이다","멜론리큐르",
"멜론리큐르|45ml","사이다|120ml",10],

["카시스 오렌지","카시스시럽",
"카시스시럽|20ml","오렌지주스|120ml",4]

].map(x=>({

name:x[0],
base:x[1],
ings:x.slice(2,-1).map(v=>{
 let [a,b]=v.split("|");
 return {name:a,amount:b}
}),
abv:x.at(-1),
custom:false

}));

let owned=
 JSON.parse(localStorage.getItem("mybar_owned")||"null")
 ||defaultIngredients.slice();

let favs=
 JSON.parse(localStorage.getItem("mybar_favs")||"[]");

let customs=
 JSON.parse(localStorage.getItem("mybar_customs")||"[]");

customs.forEach(c=>c.custom=true);

let tab="home";
let query="";
let abvFilter="all";
let makeFilter="all";

function save(){

 localStorage.setItem(
  "mybar_owned",
  JSON.stringify(owned)
 );

 localStorage.setItem(
  "mybar_favs",
  JSON.stringify(favs)
 );

 localStorage.setItem(
  "mybar_customs",
  JSON.stringify(customs)
);

}

function allRecipes(){

 return recipes.concat(customs);

}

function has(i){

 return owned.includes(i);

}

function status(r){

 let missing=r.ings.filter(i=>!has(i.name));

 return {
  missing,
  ok:missing.length===0
 };

}

function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );

}

function filtered(list){

 return list.filter(r=>{

  let q=query.trim().toLowerCase();

  let hit=
   !q ||
   r.name.toLowerCase().includes(q) ||
   r.ings.some(
    i=>i.name.toLowerCase().includes(q)
   );

  let ab=
   abvFilter==="all" ||
   (abvFilter==="0-5"&&r.abv<=5) ||
   (abvFilter==="5-10"&&r.abv>5&&r.abv<=10) ||
   (abvFilter==="10-15"&&r.abv>10&&r.abv<=15) ||
   (abvFilter==="15+"&&r.abv>15);

  let st=status(r);

  let mf=
   makeFilter==="all" ||
   (makeFilter==="yes"&&st.ok) ||
   (makeFilter==="no"&&!st.ok);

  return hit&&ab&&mf;

 });

}

function card(r){

 let st=status(r);
 let isFav=favs.includes(r.name);

 return `

<div class="card"
 onclick='openRecipe(${JSON.stringify(r.name)})'>

<button class="fav"
 onclick='event.stopPropagation();
 toggleFav(${JSON.stringify(r.name)})'>

${isFav?"❤️":"♡"}

</button>

<h3>${esc(r.name)}</h3>

<div class="meta">
약 ${r.abv}% · ${r.ings.length}가지 재료
</div>

<span class="tag ${st.ok?"ok":"warn"}">

${st.ok
 ?"🟢 바로 만들기"
 :"🟡 "+st.missing.length+"개 부족"}

</span>

${r.custom
 ?'<span class="tag">✏️ 자작</span>'
 :""
}

</div>

`;

}

function renderHome(){

 let list=
  allRecipes()
  .filter(r=>status(r).ok);

 return `

<div class="hero">

<h1>오늘 뭐 마시지? 🍸</h1>

<p>
현재 가진 재료로 바로 만들 수 있는
칵테일을 찾아보세요.
</p>

<div class="actions">

<button class="primary"
 onclick="randomCocktail()">
🎲 랜덤 추천
</button>

<button class="secondary"
 onclick="tab='cocktails';render()">
전체 보기
</button>

</div>

</div>

<div class="statgrid">

<div class="stat">
<b>${owned.length}</b>
<small>보유 재료</small>
</div>

<div class="stat">
<b>${list.length}</b>
<small>지금 가능</small>
</div>

<div class="stat">
<b>${favs.length}</b>
<small>즐겨찾기</small>
</div>

</div>

<div class="sectionTitle">
지금 만들 수 있어요
</div>

<div class="grid">

${list.slice(0,6).map(card).join("")||
'<div class="empty">아직 바로 만들 수 있는 칵테일이 없어요.</div>'}

</div>

<div class="sectionTitle">
내 재료로 찾아보기
</div>

<div class="row">

${owned.slice(0,12).map(i=>

`<button class="pill"
onclick='searchIngredient(${JSON.stringify(i)})'>
${esc(i)}
</button>`

).join("")}

</div>

`;

}

function filters(){

return `

<div class="sectionTitle">
만들 수 있는지
</div>

<div class="row">

<button class="pill ${makeFilter==="all"?"active":""}"
onclick="setMake('all')">
전체
</button>

<button class="pill ${makeFilter==="yes"?"active":""}"
onclick="setMake('yes')">
🟢 만들 수 있음
</button>

<button class="pill ${makeFilter==="no"?"active":""}"
onclick="setMake('no')">
🟡 부족 재료
</button>

</div>

<div class="sectionTitle">
도수
</div>

<div class="row">

<button class="pill ${abvFilter==="all"?"active":""}"
onclick="setAbv('all')">
전체
</button>

<button class="pill ${abvFilter==="0-5"?"active":""}"
onclick="setAbv('0-5')">
0~5%
</button>

<button class="pill ${abvFilter==="5-10"?"active":""}"
onclick="setAbv('5-10')">
5~10%
</button>

<button class="pill ${abvFilter==="10-15"?"active":""}"
onclick="setAbv('10-15')">
10~15%
</button>

<button class="pill ${abvFilter==="15+"?"active":""}"
onclick="setAbv('15+')">
15% 이상
</button>

</div>

`;

}

function renderCocktails(){

 let list=filtered(allRecipes());

 return `

${filters()}

<div class="sectionTitle">
칵테일 ${list.length}개
</div>

<div class="grid">

${list.map(card).join("")||
'<div class="empty">검색 조건에 맞는 칵테일이 없어요.</div>'}

</div>

`;

}

function renderIngredients(){

 let q=query.toLowerCase();

 let list=
  owned.filter(
   i=>i.toLowerCase().includes(q)
  );

 return `

<div class="hero">

<h1>내 재료 🧊</h1>

<p>
재료를 추가하거나 삭제하면
만들 수 있는 칵테일이 자동으로 바뀝니다.
</p>

<button class="primary"
onclick="openIngredientModal()">
＋ 재료 추가
</button>

</div>

<div class="sectionTitle">
보유 재료 ${owned.length}개
</div>

<div class="list">

${list.map(i=>`

<div class="item">

<div>

<b>${esc(i)}</b>
<br>
<small>이 재료로 만들기 →</small>

</div>

<div>

<button class="secondary"
onclick='searchIngredient(${JSON.stringify(i)})'>
보기
</button>

<button class="danger"
onclick='removeIngredient(${JSON.stringify(i)})'>
삭제
</button>

</div>

</div>

`).join("")||

'<div class="empty">검색 결과가 없어요.</div>'}

</div>

`;

}

function renderFav(){

 let list=
  allRecipes()
  .filter(r=>favs.includes(r.name));

 return `

<div class="hero">

<h1>즐겨찾기 ❤️</h1>

<p>
마음에 드는 칵테일을 저장해두세요.
</p>

</div>

<div class="grid">

${list.map(card).join("")||
'<div class="empty">아직 즐겨찾기한 칵테일이 없어요.</div>'}

</div>

`;

}

function render(){

 document.getElementById("globalSearch").value=query;

 document
  .querySelectorAll(".bottom button")
  .forEach(b=>
   b.classList.toggle("on",b.dataset.tab===tab)
  );

 document.getElementById("main").innerHTML=

  tab==="home"
   ?renderHome()
   :tab==="cocktails"
   ?renderCocktails()
   :tab==="ingredients"
   ?renderIngredients()
   :renderFav();

}

function toggleFav(name){

 if(favs.includes(name))
  favs=favs.filter(x=>x!==name);
 else
  favs.push(name);

 save();
 render();

}

function setAbv(x){

 abvFilter=x;
 tab="cocktails";
 render();

}

function setMake(x){

 makeFilter=x;
 tab="cocktails";
 render();

}

function searchIngredient(i){

 query=i;
 tab="cocktails";
 makeFilter="all";
 abvFilter="all";
 render();

}

function randomCocktail(){

 let list=
  allRecipes()
  .filter(r=>status(r).ok);

 if(!list.length){

  alert("현재 재료로 만들 수 있는 칵테일이 없어요.");
  return;

 }

 let r=
  list[Math.floor(Math.random()*list.length)];

 openRecipe(r.name);

}

function openRecipe(name){

 let r=
  allRecipes()
  .find(x=>x.name===name);

 if(!r)return;

 let st=status(r);

 document.getElementById("sheet").innerHTML=`

<button class="close"
onclick="closeModal()">
×
</button>

<h2>${esc(r.name)}</h2>

<div class="meta">
약 ${r.abv}% ·
${r.custom?"자작 칵테일":"MyBar 레시피"}
</div>

<div class="sectionTitle">
재료
</div>

${r.ings.map(i=>`

<div class="recipeLine">

<span class="${has(i.name)?"match":"missing"}">

${has(i.name)?"✓":"✕"}
${esc(i.name)}

</span>

<b>${esc(i.amount)}</b>

</div>

`).join("")}

<div class="sectionTitle">
만드는 법
</div>

<p>
${esc(
 r.method||
 "얼음을 채운 잔에 재료를 순서대로 넣고 가볍게 저어 완성합니다."
)}
</p>

${st.missing.length?

`<div class="tag warn">
부족한 재료:
${st.missing.map(x=>esc(x.name)).join(", ")}
</div>`

:

`<div class="tag ok">
🟢 현재 재료로 만들 수 있습니다.
</div>`

}

<div class="actions">

<button class="primary"
onclick='toggleFav(${JSON.stringify(r.name)});closeModal()'>

${favs.includes(r.name)
 ?"❤️ 즐겨찾기 해제"
 :"♡ 즐겨찾기"}

</button>

${r.custom?

`<button class="secondary"
onclick='deleteCustom(${JSON.stringify(r.name)})'>
자작칵테일 삭제
</button>`

:""}

</div>

`;

 document.getElementById("modal").style.display="flex";

}

function closeModal(){

 document.getElementById("modal").style.display="none";

}

function openIngredientModal(){

 document.getElementById("sheet").innerHTML=`

<button class="close"
onclick="closeModal()">
×
</button>

<h2>재료 추가</h2>

<div class="field">

<label>재료 이름</label>

<input id="newIng"
placeholder="예: 레몬주스">

</div>

<div class="actions">

<button class="primary"
onclick="addIngredient()">
추가
</button>

<button class="secondary"
onclick="closeModal()">
취소
</button>

</div>

`;

 document.getElementById("modal").style.display="flex";

}

function addIngredient(){

 let v=
  document.getElementById("newIng")
  .value.trim();

 if(!v){

  alert("재료 이름을 입력해주세요.");
  return;

 }

 if(!owned.includes(v))
  owned.push(v);

 save();
 closeModal();
 render();

}

function removeIngredient(v){

 if(confirm(`"${v}"을(를) 내 재료에서 삭제할까요?`)){

  owned=
   owned.filter(x=>x!==v);

  save();
  render();

 }

}

function openCustomModal(){

 document.getElementById("sheet").innerHTML=`

<button class="close"
onclick="closeModal()">
×
</button>

<h2>✏️ 자작 칵테일 추가</h2>

<div class="field">

<label>칵테일 이름</label>

<input id="cName"
placeholder="예: 보형 스페셜">

</div>

<div class="field">

<label>예상 도수 (%)</label>

<input id="cAbv"
type="number"
min="0"
max="100"
step="0.1"
placeholder="예: 12">

</div>

<div class="field">

<label>
재료
(한 줄에 하나씩: 재료명, 용량)
</label>

<textarea
id="cIng"
rows="6"
placeholder="진, 45ml
파인애플주스, 90ml
코코넛시럽, 10ml"></textarea>

</div>

<div class="field">

<label>만드는 법</label>

<textarea
id="cMethod"
rows="4"
placeholder="얼음을 채우고 재료를 넣어 가볍게 저어주세요."></textarea>

</div>

<div class="actions">

<button class="primary"
onclick="saveCustom()">
저장
</button>

<button class="secondary"
onclick="closeModal()">
취소
</button>

</div>

`;

 document.getElementById("modal").style.display="flex";

}

function saveCustom(){

 let name=
  document.getElementById("cName")
  .value.trim();

 let abv=
  parseFloat(
   document.getElementById("cAbv").value
  )||0;

 let raw=
  document.getElementById("cIng")
  .value.trim();

 let method=
  document.getElementById("cMethod")
  .value.trim();

 if(!name||!raw){

  alert("이름과 재료를 입력해주세요.");
  return;

 }

 let ings=
  raw.split(/\n/)
  .map(line=>{

   let p=line.split(",");

   return {

    name:(p[0]||"").trim(),

    amount:
     (p.slice(1).join(",")||"적당량").trim()

   };

  })
  .filter(x=>x.name);

 if(!ings.length){

  alert("재료를 입력해주세요.");
  return;

 }

 customs.push({

  name,
  base:"자작",
  ings,
  abv,
  method,
  custom:true

 });

 save();
 closeModal();

 tab="cocktails";
 query=name;

 render();

}

function deleteCustom(name){

 if(confirm(`"${name}" 자작 칵테일을 삭제할까요?`)){

  customs=
   customs.filter(x=>x.name!==name);

  favs=
   favs.filter(x=>x!==name);

  save();
  closeModal();
  render();

 }

}

document
 .querySelectorAll(".bottom button")
 .forEach(b=>{

  b.onclick=()=>{

   tab=b.dataset.tab;
   query="";
   abvFilter="all";
   makeFilter="all";

   render();

  };

 });

document
 .getElementById("globalSearch")
 .addEventListener("input",e=>{

  query=e.target.value;

  if(tab==="home")
   tab="cocktails";

  render();

 });

document
 .getElementById("addCocktail")
 .onclick=openCustomModal;

document
 .getElementById("modal")
 .addEventListener("click",e=>{

  if(e.target.id==="modal")
   closeModal();

 });

if("serviceWorker" in navigator){

 window.addEventListener("load",()=>{

  navigator.serviceWorker
   .register("./sw.js")
   .catch(()=>{});

 });

}

render();

</script>

</body>
</html>
